name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
      - uses: actions/upload-artifact@v4
        with:
          name: RamMx-win-x64
          path: |
            artifacts/RamMx-win-x64.zip
            artifacts/RamMx-win-x64.zip.sha256.txt
